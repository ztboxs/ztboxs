      <stop stop-color="#13795B"/>
      <stop offset="1" stop-color="#3C63B8"/>
    </linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="358" rx="24"/></clipPath>
  </defs>
